dialogueStyle: |
  使用江户时代的日语风格：
  - 使用敬语：ござる、でござる、候
  - 武士用语：拙者、某
  - 商人用语：おいら、あっし
  - 提及歌舞伎、浮世绘、相扑
  - 避免现代词汇

