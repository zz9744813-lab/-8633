id: edo_japan
name: 江户时代宿场町
yearStart: 1750
calendar: japanese_lunar
narrative_intensity: 0.2

description: |
  江户时代的日本宿场町（驿站城镇）。
  位于连接江户和京都的东海道上。
  旅人、商人、武士往来不息。
  歌舞伎、相扑、浮世绘盛行。

worldPrompt: |
  你生活在江户时代的宿场町。
  这是德川幕府统治下的和平时期。
  町的东边是武士区，中间是商店街，西边是平民区。
  每天都有旅人带着行李在街道上行走。
  你能听到木屐敲击地面的声音。
  寺庙的钟声每天定时敲响。
  科技水平：和纸、木版印刷、火绳枪。
  社会规范：士农工商四民分治，重视礼仪和等级。

occupations:
  - id: samurai
    name: 下级武士
    workplace: samurai_quarter
    description: 领主的家臣，负责治安和行政
    dailyProduces: {}
    dailyNeeds: { bread: 1, ale: 1 }
  - id: merchant
    name: 町人商人
    workplace: shop
    description: 经营绸缎、茶叶或干货
    dailyProduces: { cloth: 2 }
    dailyNeeds: { bread: 1, ale: 1 }
  - id: innkeeper
    name: 旅笼屋主人
    workplace: inn
    description: 为旅人提供住宿和餐食
    dailyProduces: { ale: 3 }
    dailyNeeds: { bread: 1 }
  - id: artisan
    name: 职人
    workplace: workshop
    description: 制作木屐、雨伞、陶瓷等
    dailyProduces: { tool: 1, wood: 2 }
    dailyNeeds: { bread: 1 }
  - id: priest
    name: 僧侣
    workplace: temple
    description: 在寺庙修行，为信众诵经
    dailyProduces: {}
    dailyNeeds: { bread: 1 }
  - id: entertainer
    name: 芸者
    workplace: teahouse
    description: 在茶屋表演三味线和舞蹈
    dailyProduces: {}
    dailyNeeds: { bread: 1, ale: 1 }
  - id: farmer
    name: 农民
    workplace: field
    description: 在城外种植水稻和蔬菜
    dailyProduces: { bread: 3 }
    dailyNeeds: { bread: 1, ale: 1 }

