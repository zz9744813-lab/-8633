  - 中文
  - Русский

dialogueStyle: |
  使用科幻风格的专业术语：
  - 提及氧气水平、辐射、系统状态
  - 使用火星特有的词汇：穹顶、红土、蓝星（地球）
  - 语气务实、略带孤独感
  - 避免提及地球才有的日常事物

