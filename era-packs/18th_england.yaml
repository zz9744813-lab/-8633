id: 18th_england
name: 18世纪英格兰小镇
yearStart: 1780
calendar: gregorian
narrative_intensity: 0.3

description: |
  工业革命初期的英格兰乡村小镇。
  蒸汽机尚未普及，马车是主要交通工具。
  社会结构分明：贵族、商人、工匠、农民。

worldPrompt: |
  你生活在18世纪末的英格兰小镇。
  这是乔治三世统治时期，美国独立战争刚结束不久。
  镇上的人们主要务农、做手工艺或做小生意。
  教堂是社区中心，每周日大家都会去礼拜。
  科技水平：马车、蜡烛、铁器、印刷术。
  社会规范：等级分明，重视礼仪，男女分工明确。

occupations:
  - id: farmer
    name: 农民
    workplace: farm
    description: 耕种土地，种植小麦、大麦等作物
    initialSkills: { farming: 25, animal_handling: 20 }
    dailyProduces: { bread: 4 }
    dailyNeeds: { bread: 1, ale: 1 }
  - id: blacksmith
    name: 铁匠
    workplace: smithy
    description: 锻造农具、马蹄铁和简单的金属制品
    initialSkills: { smithing: 30, bargaining: 10, reading: 5 }
    dailyProduces: { tool: 2 }
    dailyNeeds: { bread: 1, meat: 1 }
  - id: innkeeper
    name: 酒馆老板
    workplace: tavern
    description: 经营酒馆，为旅人提供食宿和酒水
    initialSkills: { hospitality: 25, bargaining: 15 }
    dailyProduces: { ale: 4 }
    dailyNeeds: { bread: 1 }
  - id: merchant
    name: 商人
    workplace: market
    description: 买卖商品，可能是布料、香料或日用品
    initialSkills: { bargaining: 30, reading: 15 }
    dailyProduces: { cloth: 3 }
    dailyNeeds: { bread: 1, ale: 1 }
  - id: priest
    name: 牧师
    workplace: church
    description: 主持礼拜，为社区居民提供精神指导
    initialSkills: { reading: 35, oration: 25 }
    dailyProduces: {}
    dailyNeeds: { bread: 1 }
  - id: weaver
    name: 织工
    workplace: cottage
    description: 在家织布，制作衣物和布料
    initialSkills: { weaving: 30 }
    dailyProduces: { cloth: 3 }
    dailyNeeds: { bread: 1 }
  - id: carpenter
    name: 木匠
    workplace: workshop
    description: 制作家具、房屋结构和其他木制品
    initialSkills: { carpentry: 30, smithing: 5 }
    dailyProduces: { wood: 3, tool: 1 }
    dailyNeeds: { bread: 1, ale: 1 }
  - id: baker
    name: 面包师
    workplace: bakery
    description: 烤制面包和糕点
    initialSkills: { baking: 30, bargaining: 5 }
    dailyProduces: { bread: 5 }
    dailyNeeds: { bread: 1 }

