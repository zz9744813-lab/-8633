id: song_dynasty
name: 宋朝江南水乡
yearStart: 1080
calendar: lunar

description: |
  北宋中期的江南水乡。
  经济繁荣，文化昌盛。
  科举制度完善，文人地位崇高。
  茶道、诗词、书画盛行。

worldPrompt: |
  你生活在北宋时期的江南水乡。
  这是宋神宗元丰年间，王安石变法虽遇阻力但影响深远。
  镇上河流纵横，石桥相连。
  文人墨客常聚于茶楼，吟诗作画。
  市井繁华，商铺林立。
  科技水平：活字印刷、指南针、火药。
  社会规范：重视科举，尊重文人，男耕女织。

