id: song_dynasty
name: 宋朝江南水乡
yearStart: 1080
calendar: lunar
narrative_intensity: 0.3

description: |
  北宋中期的江南水乡。
  经济繁荣，文化昌盛。
  科举制度完善，文人地位崇高。
  茶道、诗词、书画盛行。

worldPrompt: |
  你生活在北宋时期的江南水乡。
  这是宋神宗元丰年间，王安石变法虽遇阻力但影响深远。
  镇上河流纵横，石桥相连。
  文人墨客常聚于茶楼，吟诗作画。
  市井繁华，商铺林立。
  科技水平：活字印刷、指南针、火药。
  社会规范：重视科举，尊重文人，男耕女织。

occupations:
  - id: farmer
    name: 农夫
    workplace: field
    description: 耕种水稻、桑麻
    dailyProduces: { bread: 3 }
    dailyNeeds: { bread: 1, ale: 1 }
  - id: scholar
    name: 书生
    workplace: academy
    description: 读书备考，准备科举
    dailyProduces: {}
    dailyNeeds: { bread: 1 }
  - id: merchant
    name: 商人
    workplace: shop
    description: 经营店铺，买卖货物
    dailyProduces: { cloth: 2 }
    dailyNeeds: { bread: 1, meat: 1 }
  - id: innkeeper
    name: 茶肆老板
    workplace: teahouse
    description: 经营茶肆，招待南来北往的客人
    dailyProduces: { ale: 3 }
    dailyNeeds: { bread: 1 }
  - id: craftsman
    name: 工匠
    workplace: workshop
    description: 制作瓷器、丝绸、竹器等
    dailyProduces: { tool: 1, cloth: 2 }
    dailyNeeds: { bread: 1 }
  - id: physician
    name: 郎中
    workplace: clinic
    description: 行医问诊，采药制药
    dailyProduces: { potion: 1 }
    dailyNeeds: { bread: 1 }
  - id: monk
    name: 僧人
    workplace: temple
    description: 在寺庙修行，诵经礼佛
    dailyProduces: {}
    dailyNeeds: { bread: 1 }
  - id: fisherman
    name: 渔夫
    workplace: river
    description: 捕鱼捞虾，撑船摆渡
    dailyProduces: { meat: 2 }
    dailyNeeds: { bread: 1, ale: 1 }

