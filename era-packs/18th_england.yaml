dialogueStyle: |
  使用18世纪的英式英语风格：
  - 使用 "thee", "thou", "thy" 等古英语词汇（可选）
  - 语气正式但有乡土气息
  - 提及天气、收成、教会事务
  - 避免现代词汇如 "OK", "cool", "phone" 等

