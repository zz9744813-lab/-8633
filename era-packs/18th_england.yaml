id: 18th_england
name: 18世纪英格兰小镇
yearStart: 1780
calendar: gregorian

description: |
  工业革命初期的英格兰乡村小镇。
  蒸汽机尚未普及，马车是主要交通工具。
  社会结构分明：贵族、商人、工匠、农民。

worldPrompt: |
  你生活在18世纪末的英格兰小镇。
  这是乔治三世统治时期，美国独立战争刚结束不久。
  镇上的人们主要务农、做手工艺或做小生意。
  教堂是社区中心，每周日大家都会去礼拜。
  科技水平：马车、蜡烛、铁器、印刷术。
  社会规范：等级分明，重视礼仪，男女分工明确。

occupations:
  - id: farmer
    name: 农民
    workplace: farm
    description: 耕种土地，种植小麦、大麦等作物
  - id: blacksmith
    name: 铁匠
    workplace: smithy
    description: 锻造农具、马蹄铁和简单的金属制品
  - id: innkeeper
    name: 酒馆老板
    workplace: tavern
    description: 经营酒馆，为旅人提供食宿和酒水
  - id: merchant
    name: 商人
    workplace: market
    description: 买卖商品，可能是布料、香料或日用品
  - id: priest
    name: 牧师
    workplace: church
    description: 主持礼拜，为社区居民提供精神指导
  - id: weaver
    name: 织工
    workplace: cottage
    description: 在家织布，制作衣物和布料
  - id: carpenter
    name: 木匠
    workplace: workshop
    description: 制作家具、房屋结构和其他木制品
  - id: baker
    name: 面包师
    workplace: bakery
    description: 烤制面包和糕点

